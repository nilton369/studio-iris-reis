  <style>
    /* -------------------------------------------------------
       RESET E CONFIGURAÇÕES GERAIS
       ------------------------------------------------------- */
    * {

      margin: 0;
      padding: 0;

    /* -------------------------------------------------------
       CONTAINER PRINCIPAL
       ------------------------------------------------------- */
    .card-container {
      width: 100%;
      max-width: 420px;
      background-color: #141414;
      border: 1px solid #262626;
      border-radius: 20px;
      padding: 25px 20px;

      text-align: center;
    }

    /* =======================================================
       LOGO
       ======================================================= */

      height: 138px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #D4AF37;
      margin-bottom: 12px;
    }

    /* =======================================================
       TÍTULO
       ======================================================= */
    h1 {
      font-size: 1.5rem;
      color: #D4AF37;
      font-weight: 600;
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }

    p.subtitle {
      font-size: 0.9rem;
      color: #A0A0A0;
      margin-bottom: 20px;
    }

    /* =======================================================
       CARROSSEL DE FOTOS
       ======================================================= */
    .carousel-container {
      position: relative;
      width: 100%;
      height: 320px;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 25px;
      border: 1px solid #2A2A2A;
    }

    .carousel-slide {
      display: flex;
      width: 100%;
      height: 100%;
      transition: transform 0.4s ease-in-out;
    }

    .carousel-img {
      min-width: 100%;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* =======================================================
       BOTÕES DE NAVEGAÇÃO DO CARROSSEL
       ======================================================= */
    .carousel-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.6);
      color: #D4AF37;
      border: 1px solid #D4AF37;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    .carousel-btn:hover {
      background: rgba(212, 175, 55, 0.15);
    }

    .carousel-btn.prev { left: 10px; }
    .carousel-btn.next { right: 10px; }

    /* =======================================================
       GRUPO DOS BOTÕES
       ======================================================= */
    .buttons-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* =======================================================
       MODELO GERAL DOS BOTÕES
       ======================================================= */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);

    /* =======================================================

  <!-- =======================================================

  <script>

    /* =======================================================
       1. CARROSSEL DE FOTOS
       ======================================================= */

    /* Começa mostrando a primeira foto */
    let currentSlideIndex = 0;

    /* Pega o elemento que contém as fotos */
    const slideContainer =
      document.getElementById('carouselSlide');

    /* Conta quantas imagens existem */
    const totalSlides =
      document.querySelectorAll('.carousel-img').length;

    /* -------------------------------------------------------
       FUNÇÃO PARA MUDAR DE FOTO
       ------------------------------------------------------- */
    function moveSlide(direction) {

      /* Soma 1 ou -1 ao número da foto */
      currentSlideIndex += direction;

      /* -----------------------------------------------
         Se passou da última foto, volta para a primeira.
         ----------------------------------------------- */
      if (currentSlideIndex >= totalSlides) {
        currentSlideIndex = 0;
      }

      /* -----------------------------------------------
         Se voltou antes da primeira foto, vai para a última.
         ----------------------------------------------- */
      if (currentSlideIndex < 0) {
        currentSlideIndex = totalSlides - 1;
      }

      /* -----------------------------------------------
         Move o carrossel horizontalmente.
         ----------------------------------------------- */
      slideContainer.style.transform =
        `translateX(-${currentSlideIndex * 100}%)`;
    }

    /* =======================================================
       2. SALVAR NA AGENDA — VCARD
       ======================================================= */
    function downloadVCard() {

      /*
        Criamos o contato no padrão VCARD.
        As quebras de linha são importantes
        para Android e iPhone reconhecerem
        corretamente o arquivo.
      */
      const vcardData = [
        'BEGIN:VCARD',
        'VERSION:3.0',
        'FN:Studio Iris Reis',
        'ORG:Studio Iris Reis;Lash Designer',
        'TEL;TYPE=CELL,VOICE:+5511984757493',
        'NOTE:Especialista em Extensão de Cílios e Estética',
        'END:VCARD'
      ].join('\r\n');

      /* -----------------------------------------------
         Cria o arquivo temporariamente
         ----------------------------------------------- */
      const blob = new Blob(
        [vcardData],
        { type: 'text/vcard;charset=utf-8;' }
      );

      /* Cria uma URL temporária para o arquivo */
      const url = URL.createObjectURL(blob);

      /* Cria um link temporário */
      const link = document.createElement('a');

      /* Coloca a URL do arquivo no link */
      link.href = url;

      /* Nome que será dado ao arquivo */
      link.setAttribute('download', 'Studio_Iris_Reis.vcf');

      /* Coloca o link temporariamente na página */
      document.body.appendChild(link);

      /* Simula o clique */
      link.click();

      /* Remove o link */
      document.body.removeChild(link);

      /* Libera a memória usada pela URL */
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

  </script>
